services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: iptv
      POSTGRES_PASSWORD: iptv
      POSTGRES_DB: iptv
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U iptv -d iptv"]
      interval: 2s
      timeout: 3s
      retries: 20

  api:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://iptv:iptv@db:5432/iptv?sslmode=disable
      STREAM_BASE_URL: http://stream.example.com
    ports:
      - "8080:8080"